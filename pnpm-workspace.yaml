packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  core-js: true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - 'esbuild'
  - 'sharp'
  - 'prisma'
  - 'msgpackr-extract'
  - 'unrs-resolver'
  - 'onnxruntime-web'
  - 'protobufjs'
  - 'core-js'
